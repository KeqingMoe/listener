# 首次使用时复制为 config.toml；不要覆盖已有配置。
# QQ号、群号是占位值，必须替换；模型名称和模型密钥必填。
# 密钥写入 .env：ONEBOT_ACCESS_TOKEN，以及每个模型 api_key_env 指定的变量。
# 相对路径以 config.toml 所在目录为基准。完整参考：docs/configuration.md。

[bot]
name = "Listener"
owner_id = "100000001"

[onebot]
url = "ws://127.0.0.1:3001"

# 具名模型：[models.<名字>]，名字用于群选用和用量统计。可以定义多个，
# 群用 model = "名字" 选用；只定义一个时所有群默认使用它。
[models.main]
api_key_env = "OPENAI_API_KEY"
transport = {
  type = "responses",
  incremental = false,
}
base_url = "https://api.openai.com/v1"
model = "" # 必填：填写服务商提供的、支持工具调用的模型名称；看图另需图片输入能力。
# reasoning、正文和工具调用共享此单次输出预算；按服务商上限执行。
max_output_tokens = 32768
# 单次模型请求最长等待；长 reasoning 可能需要更久。
timeout_ms = 180000
# 工具呈现方式："ts"（默认，TypeScript声明）、"both"（声明+参数结构）或"json"。
# 模型调用工具时参数经常出错，可改为 "both"。
# tool_schema = "ts"

# 另一个模型示例：某些群改用其他服务商或另一把key。
# [models.other]
# api_key_env = "OTHER_API_KEY"
# transport = "chat"
# base_url = "https://example.com/v1"
# model = ""

# 联网搜索服务；不配置时不提供 web_search。web_fetch 不依赖此项。详见 docs/web.md。
# [web]
# search = { type = "searxng", url = "http://127.0.0.1:8888" }

# 收藏添加需要Bot和NapCat访问同一实际原图目录；同主机默认无需另填。
# 容器部署时先建立目录映射，再按两侧路径配置；不是QQ收藏ID清单。
# [storage]
# custom_face_directory = "data/custom-face-originals" # Bot侧，相对config.toml。
# napcat_custom_face_directory = "/qqbot-custom-faces" # NapCat侧，绝对POSIX路径。
# 产物（create_artifact/create_image）同理：上传群文件与发送产物图片时NapCat按路径读取。
# artifact_directory = "data/artifacts" # Bot侧，相对config.toml。
# napcat_artifact_directory = "/qqbot-artifacts" # NapCat侧，绝对POSIX路径。

[defaults]
# false：只服务显式启用的群；true：服务Bot加入的所有群，可按群排除。
enabled = false
# 定义了多个模型时必填；群内也可写 model = "名字" 覆盖。
# model = "main"
persona = "prompts/listener.example.md"
reply.random = false
# 打开时最新未读QQ事件数及运行期QQ缓冲容量；异步结果不占此限。安全正整数。
session.event_window_size = 20
# 一次唤醒全部工具共享调用次数；默认96，安全正整数范围1..9007199254740991。
execution.max_tool_calls_per_wake = 96
# 单次唤醒的总时间预算；包含模型请求和工具调用。
execution.wake_timeout_ms = 240000

# 后台 reaction 观察默认开启，与添加回应和查询回应者的工具权限独立。

[defaults.tools]
# 以下展示常用工具，值均与程序默认一致；未列出的工具仍使用各自默认值。
# QQ功能：查询、互动及媒体发送默认direct，群管和群文件写默认confirm。
get_group_info = "direct" # 查询QQ群名称、人数等资料。
poke_member = "direct" # QQ拍一拍／戳一戳指定群成员。
react_message = "direct" # 添加或取消消息下方的表情回应，不是发送表情消息。
send_group_ai_voice = "direct" # 使用QQ提供的AI声线发送文字转语音，不是本项目模型生成音频。
transcribe_voice = "direct" # 按需识别本群语音，调用QQ原生转文字；只读，不支持confirm，也不新增唤醒条件。
mute_member = {
  mode = "confirm", # 禁言需主人确认；direct为自主执行，off为关闭。
  max_seconds = 2592000, # 默认及最大30天；可显式设置更小的正整数秒数。
}
leave_group = "off" # Bot退出当前群，默认不开放。

# 自定义收藏是Bot账号共享资源，开启本群工具即授权访问共享收藏，不是商城整套。
# 四个写工具也可改为confirm或off；list/view只支持direct或off。
list_custom_faces = "direct" # 自动读取有界收藏目录、按描述或本地标签检索，无需手工清单。
view_custom_face = "direct" # 将收藏图交给模型查看；与view_images共享去重状态及单图下载上限，无图片数量配额。
send_custom_face = "direct" # 发送原始收藏图片，保留GIF/WebP，不发送预览JPEG。
add_custom_face = "direct" # 收藏本群可核验图片，随后回查并设置描述，分阶段报告结果。
delete_custom_face = "direct" # 删除账号收藏，会影响其他群；正常提交不等于已核验删除。
set_custom_face_description = "direct" # 修改QQ描述；可附本地检索标签，标签不写入QQ字段。

# Bot辅助工具：服务于模型的阅读、理解或后续关注，不是QQ中的同名操作。
view_images = {
  mode = "direct", # 读取本群可核验图片，供当前模型看图；需要模型支持图片输入。
  # 两种看图工具共享本轮成功读取去重状态，失败可重试；不限制图片数量。
  max_download_mb = 10, # 单图下载默认10 MiB，范围1..10 MiB；收藏原图下载也受此上限及格式校验限制。
}
read_forward = "direct" # 展开合并转发内容供模型阅读，不会发送转发。
manage_attention = {
  mode = "direct", # 安排对后续消息、成员或时间条件的关注。
  max_plans = 16,
}
# 完整工具用途、默认模式和配置参数见 docs/configuration.md。

[groups."100000002"]
enabled = true

# 可选：仅调整本群的禁言时长上限，仍需主人确认。
# tools.mute_member = {
#   mode = "confirm",
#   max_seconds = 120,
# }

# 可选：启用第二个群，使用独立人设文件（文件须存在）。
# [groups."123456789"]
# enabled = true
# persona = "prompts/group.md"
